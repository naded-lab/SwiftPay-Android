[[headers]]
  for = "/pwa/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# مسار احتياطي (fallback) لأي رابط غير معروف: نُعيد index.html بدل صفحة بيضاء/404 فارغة
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
