name: Build SwiftPay Release APK

on:
  push:
    branches:
      - "06"
    paths:
      - "www/**"
      - "native-stage2/**"
      - "branding/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "setup.sh"
      - ".github/workflows/build-release-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Android project
        run: npx cap add android

      - name: Apply SwiftPay native layer and branding
        run: |
          chmod +x native-stage2/install-stage2.sh
          ./native-stage2/install-stage2.sh android

      - name: Sync web assets
        run: npx cap sync android

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SWIFTPAY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/swiftpay-release.jks
          chmod 600 android/app/swiftpay-release.jks

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SWIFTPAY_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SWIFTPAY_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SWIFTPAY_KEY_ALIAS }}
        working-directory: android
        run: |
          cat > keystore.properties <<EOF2
          storeFile=swiftpay-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF2
          python3 ../scripts/configure_signing.py

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftPay-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
