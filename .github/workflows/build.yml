name: Build APK

on:
  push:
    branches: [ "stage3-ussd-balance", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SWIFTPAY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/swiftpay-release.jks
          test -s app/swiftpay-release.jks

      - name: Create keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SWIFTPAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SWIFTPAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SWIFTPAY_KEY_PASSWORD }}
        run: |
          printf 'storeFile=swiftpay-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Verify APK
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftPay-v3.0-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f app/swiftpay-release.jks
          rm -f keystore.properties
