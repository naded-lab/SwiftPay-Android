name: Build SwiftPay APK

# مصدر الحقيقة الوحيد الآن هو نسخة الويب/Capacitor (www/). نسخة Native القديمة
# مؤرشفة في docs/archive/native-app-archived/ ولم تعد تُبنى تلقائياً.
on:
  workflow_dispatch:
  push:
    branches: [ "07" ]
    paths:
      - 'www/**'
      - 'native-stage2/**'
      - 'branding/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Capacitor 8 موصى معه رسمياً بـ JDK 21 (متوافق مع AGP 8.13.0)
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36 + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (ينشئ android/)
        run: npx cap add android
      # نفس السكربت المستخدم محلياً عبر setup.sh — وصفة بناء واحدة لكل مكان
      - name: تفعيل UssdPlugin + الأذونات + العلامة التجارية (سكربت موحّد مع setup.sh)
        run: ./native-stage2/install-stage2.sh android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Set Android version 3.0 and signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SWIFTPAY_KEYSTORE_BASE64 }}
          SWIFTPAY_KEYSTORE_FILE: ${{ github.workspace }}/android/swiftpay-release.keystore
          SWIFTPAY_KEYSTORE_PASSWORD: ${{ secrets.SWIFTPAY_KEYSTORE_PASSWORD }}
          SWIFTPAY_KEY_ALIAS: ${{ secrets.SWIFTPAY_KEY_ALIAS }}
          SWIFTPAY_KEY_PASSWORD: ${{ secrets.SWIFTPAY_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/swiftpay-release.keystore
          sed -i -E 's/versionName[[:space:]]*(=)?[[:space:]]*".*"/versionName "3.0"/' android/app/build.gradle
          sed -i -E 's/versionCode[[:space:]]*(=)?[[:space:]]*[0-9]+/versionCode 30/' android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          afterEvaluate {
              def signing = android.signingConfigs.create("release")
              signing.storeFile = file(System.getenv("SWIFTPAY_KEYSTORE_FILE"))
              signing.storePassword = System.getenv("SWIFTPAY_KEYSTORE_PASSWORD")
              signing.keyAlias = System.getenv("SWIFTPAY_KEY_ALIAS")
              signing.keyPassword = System.getenv("SWIFTPAY_KEY_PASSWORD")
              android.buildTypes.release.signingConfig = signing
          }
          EOF

      - name: Build signed Release APK
        working-directory: android
        env:
          SWIFTPAY_KEYSTORE_FILE: ${{ github.workspace }}/android/swiftpay-release.keystore
          SWIFTPAY_KEYSTORE_PASSWORD: ${{ secrets.SWIFTPAY_KEYSTORE_PASSWORD }}
          SWIFTPAY_KEY_ALIAS: ${{ secrets.SWIFTPAY_KEY_ALIAS }}
          SWIFTPAY_KEY_PASSWORD: ${{ secrets.SWIFTPAY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftPay-3.0-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
