name: Build SwiftPay APK

on:
  workflow_dispatch:
  push:
    branches:
      - stage3-ussd-balance

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify applicationId
        run: |
          grep -R "com.nadidstudio.swiftpay" android/app \
            || (echo "applicationId verification failed" && exit 1)

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SWIFTPAY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/swiftpay-release.jks

      - name: Create keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SWIFTPAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SWIFTPAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SWIFTPAY_KEY_PASSWORD }}
        run: |
          printf 'storeFile=swiftpay-release.jks
storePassword=%s
keyAlias=%s
keyPassword=%s
' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftPay-Stage3-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
